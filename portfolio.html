<!DOCTYPE html>
<html lang="uz">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Multi-language Profile Card</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2 family=Space+Grotesk:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">


    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            --bg-color: #04050e;
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --input-bg: rgba(255, 255, 255, 0.04);
            --accent: #a855f7;
            --accent-glow: rgba(168, 85, 247, 0.4);
            --glow-color: rgba(0, 242, 254, 0.15);
            --avatar-bg: rgba(255, 255, 255, 0.03);
            --input-addon: rgba(255, 255, 255, 0.08);
            --social-bg: rgba(255, 255, 255, 0.03);
        }

        [data-theme="light"] {
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(0, 0, 0, 0.08);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --input-bg: rgba(0, 0, 0, 0.03);
            --accent: #6366f1;
            --accent-glow: rgba(99, 102, 241, 0.3);
            --glow-color: rgba(99, 102, 241, 0.1);
            --avatar-bg: rgba(0, 0, 0, 0.04);
            --input-addon: rgba(0, 0, 0, 0.05);
            --social-bg: rgba(0, 0, 0, 0.02);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: all 0.4s ease;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
            display: flex;
            align-items: flex-start;

            justify-content: center;
            padding-top: 120px;

            padding-bottom: 80px;
        }

        .glow {
            position: fixed;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 70%);
            z-index: -1;
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .controls-panel {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 12px;
            z-index: 1000;
        }

        .control-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(15px);
            transition: 0.3s;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }

        .control-btn:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
            transform: scale(1.05);
            color: var(--text-main);
        }

        .premium-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            backdrop-filter: blur(25px);
            border-radius: 32px;
            padding: 40px;
            width: 90%;
            max-width: 720px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
            position: absolute;
            user-select: none;
        }

        .drag-header {
            cursor: grab;
            padding-bottom: 15px;
        }

        .drag-header:active {
            cursor: grabbing;
        }

        .card-title {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            background: linear-gradient(45deg, var(--text-main), var(--accent));

            -webkit-background-clip: text;
            background-clip: text;

            -webkit-text-fill-color: transparent;
            transition: none;
        }

        .avatar-container {
            position: relative;
            width: 110px;
            margin: 0 auto 25px;
        }

        .avatar-preview-box {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 2px dashed var(--card-border);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            background: var(--avatar-bg);
            transition: 0.3s;
        }

        .avatar-preview-box:hover {
            border-color: var(--accent);
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .avatar-preview-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }


        .age-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            background: linear-gradient(135deg, var(--accent), #00f2fe);
            color: #fff;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 50px;
            font-weight: 700;
            display: none;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .form-label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-main);
            opacity: 0.8;
            display: block;
        }

        .custom-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            padding: 12px 15px;
            color: var(--text-main);
            outline: none;
            transition: 0.3s;
        }

        .custom-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 10px var(--accent-glow);
            transform: translateY(-2px);
        }

        .input-group-text-custom {
            background: var(--input-addon);
            border: 1px solid var(--card-border);
            border-right: none;
            color: var(--text-muted);
            border-radius: 12px 0 0 12px;
            padding: 12px 15px;
            display: flex;
            align-items: center;
        }

        .social-links-grid {
            background: var(--social-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .social-input-wrapper {
            display: flex;
            align-items: center;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 6px 12px;
            margin-bottom: 10px;
            transition: 0.3s;
        }

        .social-input-wrapper:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent-glow);
        }

        .social-input-wrapper i {
            font-size: 1.1rem;
            width: 25px;
            color: var(--text-muted);
        }

        .social-input-wrapper input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            width: 100%;
            font-size: 0.85rem;
            padding-left: 5px;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 15px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .submit-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px var(--accent-glow);
        }

        .download-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            background: transparent;
            border: 2px solid var(--accent);
            color: var(--text-main);
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: var(--accent);
            color: #fff;
            transform: translateY(-2px);
        }

        .lang-menu-custom {
            position: absolute;
            top: 110%;
            right: 0;
            background: var(--bg-color);
            border: 1px solid var(--card-border);
            border-radius: 12px;
            display: none;
            min-width: 100px;
            overflow: hidden;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .lang-menu-custom.show {
            display: block;
        }

        .lang-item-custom {
            padding: 10px 15px;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.9rem;
        }

        .lang-item-custom:hover {
            background: var(--accent);
            color: white;
        }

        body:not([data-theme="light"]) input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }
    </style>
</head>

<body>
    <div class="glow" id="bgGlow"></div>

    <div class="controls-panel">
        <a href="index.html" class="control-btn" title="Orqaga qaytish">
            <i class="fas fa-chevron-left"></i>
        </a>

        <button class="control-btn" onclick="resetCardPosition()" title="Markazga qaytarish">
            <i class="fas fa-arrows-to-dot"></i>
        </button>

        <div class="lang-dropdown-wrapper">
            <button class="control-btn" onclick="toggleLangDropdown()">
                <i class="fas fa-globe"></i> <span id="langBtnText">UZ</span>
            </button>
            <div class="lang-menu-custom" id="langMenu">
                <div class="lang-item-custom" onclick="changeLanguage('uz')">O'zbekcha</div>
                <div class="lang-item-custom" onclick="changeLanguage('ru')">Русский</div>
                <div class="lang-item-custom" onclick="changeLanguage('en')">English</div>
            </div>
        </div>

        <a href="javascript:void(0)" class="control-btn" onclick="toggleTheme()" id="themeBtn">
            <i class="fas fa-sun"></i>
        </a>
    </div>

    <div class="premium-card" id="draggableCard">
        <div class="drag-header text-center" id="dragHandle">
            <h2 class="card-title" id="text-title">Profil ma'lumotlari</h2>
            <p style="font-size: 0.8rem; color: var(--text-muted);" id="text-subtitle">Ushlab siljitishingiz mumkin</p>
        </div>

        <div class="avatar-container">
            <div class="avatar-preview-box" onclick="document.getElementById('avatarInput').click()">
                <i class="fas fa-camera fa-lg" id="avatarIcon"></i>
                <img id="avatarImage">
            </div>

            <div class="age-badge" id="liveAge">0 yosh</div>
        </div>
        <input type="file" id="avatarInput" hidden onchange="previewAvatar(event)">

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" id="lbl-name">To'liq ism</label>
                <input type="text" class="custom-input" id="inputName" placeholder="Ali Valiyev">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" id="lbl-job">Mutaxassislik</label>
                <input type="text" class="custom-input" id="inputJob" placeholder="Developer">
            </div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" id="lbl-email">Email</label>
                <input type="email" class="custom-input" id="inputEmail" placeholder="mail@example.com">
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" id="lbl-phone">Telefon</label>
                <input type="tel" class="custom-input" id="inputPhone" placeholder="+998 90 ...">
            </div>
        </div>

        <div class="row">
            <div class="col-md-5 mb-3">
                <label class="form-label" id="lbl-date">Tug'ilgan sana</label>
                <input type="date" class="custom-input" id="inputDate" onchange="calculateLiveAge()">
            </div>
            <div class="col-md-7 mb-3">
                <label class="form-label" id="lbl-address">Manzil</label>
                <input type="text" class="custom-input" id="inputAddress" placeholder="Toshkent, UZ">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" id="lbl-site">Veb-sayt</label>
            <div class="d-flex">
                <span class="input-group-text-custom">https://</span>
                <input type="text" class="custom-input" style="border-radius: 0 12px 12px 0;" id="inputWebsite"
                    placeholder="portfolio.uz">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" id="lbl-skills">Tillar va ko'nikmalar</label>
            <input type="text" class="custom-input" id="inputLang" placeholder="Python, JavaScript...">
        </div>






        <script>
            const card = document.getElementById("draggableCard");
            const handle = document.getElementById("dragHandle");
            const glow = document.getElementById("bgGlow");

            const translations = {
                uz: {
                    title: "Profil ma'lumotlari",
                    subtitle: "Ushlab siljitishingiz mumkin",
                    lblName: "To'liq ism",
                    lblJob: "Mutaxassislik",
                    lblEmail: "Email",
                    lblPhone: "Telefon raqam",
                    lblDate: "Tug'ilgan sana",
                    lblAddress: "Yashash manzili",
                    lblSite: "Veb-sayt",
                    lblSkills: "Tillar va ko'nikmalar",
                    lblSocials: "Ijtimoiy tarmoqlar (Linklar)",
                    btnSave: "Saqlash",
                    btnDownload: "PDF Yuklash",
                    phName: "Ali Valiyev",
                    phJob: "Dasturchi",
                    phSkills: "Uzb, Eng, React...",
                    ageSuffix: "yosh"
                },
                ru: {
                    title: "Данные профиля",
                    subtitle: "Можно перетаскивать",
                    lblName: "Полное имя",
                    lblJob: "Профессия",
                    lblEmail: "Эл. почта",
                    lblPhone: "Номер телефона",
                    lblDate: "Дата рождения",
                    lblAddress: "Адрес проживания",
                    lblSite: "Веб-сайт",
                    lblSkills: "Языки и навыки",
                    lblSocials: "Социальные сети (Ссылки)",
                    btnSave: "Сохранить",
                    btnDownload: "Скачать PDF",
                    phName: "Али Валиев",
                    phJob: "Разработчик",
                    phSkills: "Узб, Анг, React...",
                    ageSuffix: "лет"
                },
                en: {
                    title: "Profile Details",
                    subtitle: "You can drag this card",
                    lblName: "Full Name",
                    lblJob: "Specialization",
                    lblEmail: "Email Address",
                    lblPhone: "Phone Number",
                    lblDate: "Birth Date",
                    lblAddress: "Living Address",
                    lblSite: "Website/Portfolio",
                    lblSkills: "Languages & Skills",
                    lblSocials: "Social Networks (Links)",
                    btnSave: "Save",
                    btnDownload: "Download PDF",
                    phName: "John Doe",
                    phJob: "Software Engineer",
                    phSkills: "Uzb, Eng, React...",
                    ageSuffix: "years old"
                }
            };

            let currentLang = 'uz';

            function changeLanguage(lang) {
                currentLang = lang;
                const t = translations[lang];
                document.getElementById('langBtnText').innerText = lang.toUpperCase();
                document.getElementById('text-title').innerText = t.title;
                document.getElementById('text-subtitle').innerText = t.subtitle;
                document.getElementById('lbl-name').innerText = t.lblName;
                document.getElementById('lbl-job').innerText = t.lblJob;
                document.getElementById('lbl-email').innerText = t.lblEmail;
                document.getElementById('lbl-phone').innerText = t.lblPhone;
                document.getElementById('lbl-date').innerText = t.lblDate;
                document.getElementById('lbl-address').innerText = t.lblAddress;
                document.getElementById('lbl-site').innerText = t.lblSite;
                document.getElementById('lbl-skills').innerText = t.lblSkills;
                document.getElementById('lbl-socials').innerText = t.lblSocials;

                document.getElementById('btn-save').innerHTML = `<i class="fas fa-save"></i> ${t.btnSave}`;
                document.getElementById('btn-download').innerHTML = `<i class="fas fa-download"></i> ${t.btnDownload}`;

                document.getElementById('inputName').placeholder = t.phName;
                document.getElementById('inputJob').placeholder = t.phJob;
                document.getElementById('inputLang').placeholder = t.phSkills;

                calculateLiveAge();
                toggleLangDropdown();
            }


            function calculateLiveAge() {
                const dateInput = document.getElementById('inputDate').value;
                const ageBadge = document.getElementById('liveAge');
                if (!dateInput) return;

                const birthDate = new Date(dateInput);
                const difference = Date.now() - birthDate.getTime();
                const ageDate = new Date(difference);
                const calculatedAge = Math.abs(ageDate.getUTCFullYear() - 1970);

                ageBadge.innerText = `${calculatedAge} ${translations[currentLang].ageSuffix}`;
                ageBadge.style.display = 'block';
            }



            function centerElement(el) {
                el.style.left = (window.innerWidth - el.offsetWidth) / 2 + "px";
                el.style.top = "120px";
            }
            window.onload = () => centerElement(card);

            let offsetPosX = 0, offsetPosY = 0, mouseX = 0, mouseY = 0;
            handle.onmousedown = (e) => {
                card.style.transition = "none";
                glow.style.transition = "none";
                mouseX = e.clientX; mouseY = e.clientY;
                document.onmouseup = () => { document.onmousemove = null; };
                document.onmousemove = (e) => {
                    offsetPosX = mouseX - e.clientX; offsetPosY = mouseY - e.clientY;
                    mouseX = e.clientX; mouseY = e.clientY;
                    card.style.top = (card.offsetTop - offsetPosY) + "px";
                    card.style.left = (card.offsetLeft - offsetPosX) + "px";
                    glow.style.top = (card.offsetTop - offsetPosY + card.offsetHeight / 2) + "px";
                    glow.style.left = (card.offsetLeft - offsetPosX + card.offsetWidth / 2) + "px";
                };
            };

            function resetCardPosition() {
                card.style.transition = "all 0.6s cubic-bezier(0.19, 1, 0.22, 1)";
                glow.style.transition = "all 0.6s cubic-bezier(0.19, 1, 0.22, 1)";
                centerElement(card);
                glow.style.left = "50%"; glow.style.top = "50%";
            }

            function toggleTheme() {
                const hasTheme = document.body.hasAttribute('data-theme');
                const icon = document.querySelector('#themeBtn i');
                const githubIcon = document.querySelector('.fa-github');

                if (hasTheme) {
                    document.body.removeAttribute('data-theme');
                    icon.className = 'fas fa-sun';
                    githubIcon.style.color = '#fff';
                } else {
                    document.body.setAttribute('data-theme', 'light');
                    icon.className = 'fas fa-moon';
                    githubIcon.style.color = '#000';
                }
            }

            function toggleLangDropdown() { document.getElementById('langMenu').classList.toggle('show'); }

            function previewAvatar(e) {
                const reader = new FileReader();
                reader.onload = () => {
                    document.getElementById('avatarImage').src = reader.result;
                    document.getElementById('avatarImage').style.display = 'block';
                    document.getElementById('avatarIcon').style.display = 'none';
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        </script>
</body>

</html>
